name = "acorn-site"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = [
  "/",
  "/index.html",
  "/llms.txt",
  "/r.html",
  "/downloads/acorn-mac.dmg",
  "/downloads/acorn-windows.exe",
  "/src/*",
  "/.git",
  "/.git/*",
  "/.wrangler",
  "/.wrangler/*",
  "/r",
  "/r/*",
]
not_found_handling = "404-page"
